spring.application.name=repasospring
server.port=${PORT:8081}
spring.profiles.active=dev

# Mientras desarrollas, evita que Thymeleaf guarde en caché las plantillas:
# así ves los cambios del HTML sin reiniciar el proyecto cada vez.
spring.thymeleaf.cache=false

# Permite que tu templates/error.html se use también para los errores 404.
spring.web.resources.add-mappings=true
server.error.whitelabel.enabled=false

seguridad.admin.user=admin
seguridad.entrenador.user=entrenador

# Contraseñas iniciales: NO están escritas aquí. Se leen de variables de entorno.
app.admin.password=${ADMIN_PASSWORD}
app.entrenador.password=${ENTRENADOR_PASSWORD}

